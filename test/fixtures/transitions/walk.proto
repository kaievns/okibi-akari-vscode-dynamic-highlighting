// self and this {not a block} 42
syntax = "proto3";

package example.deploy.v1;

import "google/protobuf/timestamp.proto";

option go_package = "example.com/deploy/v1;deployv1";
option java_multiple_files = true;

// A host to deploy to.
message Host {
  string name = 1;
  int32 retries = 2 [deprecated = true];
  repeated string tags = 3;
  map<string, string> labels = 4;
  google.protobuf.Timestamp seen = 5;

  message Attempt {
    int32 number = 1;
    oneof result {
      string error = 2;
      bool ok = 3;
    }
  }
  repeated Attempt attempts = 6;
  reserved 7, 9 to 11;
  reserved "self";
}

enum State {
  STATE_UNSPECIFIED = 0;
  STATE_READY = 1;
  STATE_FAILED = 2 [(custom_label) = "this"];
}

service Deployer {
  rpc Deploy(Host) returns (stream Host.Attempt) {
    option (google.api.http) = { post: "/v1/hosts/{name}:deploy" body: "*" };
  }
}
