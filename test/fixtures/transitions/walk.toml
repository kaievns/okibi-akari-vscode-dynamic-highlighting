# TOML with self, this, async and numbers.
title = "TOML {x} ${y}"
owner.name = "self"
ints = [1_000, +99, -17, 0xdead_beef, 0o755, 0b1101]
floats = [3.14, 5e+22, inf, nan]
inline = { x = 1, y = { z = [1, 2, { w = 3 }] } }
multi = """
async {line}
this"""

[server]
host = "localhost"
port = 8080

[server.tls]
enabled = true
this = 1

[[bin]]
name = "async"
